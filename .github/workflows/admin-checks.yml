name: Backend and admin checks
on:
  pull_request:
    paths: ['backend/**', 'tests/**', 'docs/index.html', 'docs/admin/**', 'docs/backend-config.json', 'docs/robots.txt', 'docs/sitemap.xml', 'docs/media/jebg-mark.svg', '.github/workflows/admin-checks.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'tests/**', 'docs/index.html', 'docs/admin/**', 'docs/backend-config.json', 'docs/robots.txt', 'docs/sitemap.xml', 'docs/media/jebg-mark.svg', '.github/workflows/admin-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Storage regression checks
        run: node tests/backend.test.cjs
      - name: Notification regression checks
        run: node tests/email.test.cjs
      - name: Admin authorization and migration checks
        run: node tests/admin.test.cjs
      - name: Indian time conversion and rollback checks
        run: node tests/timezone.test.cjs
      - name: Footer metrics and public-output privacy checks
        run: node tests/metrics.test.cjs
      - name: External visit counter checks
        run: node tests/visits.test.cjs
      - name: Configured admin access checks
        run: node tests/admin-launcher.test.cjs
      - name: SEO metadata, sitemap and crawler checks
        run: node tests/seo.test.cjs
      - name: Inline JavaScript and unique HTML identifiers
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['backend/Admin1.html','docs/admin/index.html','docs/index.html']){
            const text=fs.readFileSync(path,'utf8');
            for(const match of text.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
              if(/\btype=["']application\/ld\+json["']/i.test(match[1]))JSON.parse(match[2]);
              else new Function(match[2]);
            }
            const ids=[...text.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
            if(new Set(ids).size!==ids.length)throw Error(path+': duplicate IDs');
            console.log(path+': syntax and IDs passed');
          }
          if(fs.readFileSync('docs/CNAME','utf8').trim()!=='jebg.jamilaexim.com')throw Error('Custom domain changed');
          NODE
