name: Backend and admin checks
on:
  pull_request:
    paths: ['backend/**', 'tests/**', 'docs/index.html', 'docs/admin/**', 'docs/backend-config.json', '.github/workflows/admin-checks.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'tests/**', 'docs/index.html', 'docs/admin/**', 'docs/backend-config.json', '.github/workflows/admin-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Storage regression checks
        run: node tests/backend.test.cjs
      - name: Notification regression checks
        run: node tests/email.test.cjs
      - name: Admin authorization and migration checks
        run: node tests/admin.test.cjs
      - name: Indian time conversion and rollback checks
        run: node tests/timezone.test.cjs
      - name: Footer metrics and public-output privacy checks
        run: node tests/metrics.test.cjs
      - name: Inline JavaScript and unique HTML identifiers
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['backend/Admin.html','docs/admin/index.html','docs/index.html']){
            const text=fs.readFileSync(path,'utf8');
            for(const match of text.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi))new Function(match[1]);
            const ids=[...text.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
            if(new Set(ids).size!==ids.length)throw Error(path+': duplicate IDs');
            console.log(path+': syntax and IDs passed');
          }
          if(fs.readFileSync('docs/CNAME','utf8').trim()!=='jebg.jamilaexim.com')throw Error('Custom domain changed');
          NODE

      - name: Verify external counter service browser support
        run: |
          node <<'NODE'
          (async()=>{
            for(const url of ['https://hits.sh/api/urns/usss.jamilaexim.com','https://counterapi.com/api/jebg.jamilaexim.com/view/home-2026-11-07?readOnly=true']){
              try{
                const response=await fetch(url,{headers:{Origin:'https://jebg.jamilaexim.com'},signal:AbortSignal.timeout(15000)});
                console.log(JSON.stringify({url,status:response.status,cors:response.headers.get('access-control-allow-origin'),type:response.headers.get('content-type'),body:(await response.text()).slice(0,300)}));
              }catch(error){console.log(JSON.stringify({url,error:error.message}));}
            }
          })();
          NODE
